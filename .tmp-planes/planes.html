</head><body><div id="grid"></div>
<script>
const NOTES = {
  twinTail: 'F-22 bounds · twin canted fins',
  singleTail: 'F-16A bounds · tip missiles',
  crankedDelta: 'F-16XL bounds · no tailplanes',
  wideWing: 'F-14A bounds (wings forward)',
};
const grid = document.getElementById('grid');
const views = [];
for (const [name, p] of Object.entries(PLANES)) {
  const cell = document.createElement('div'); cell.className = 'cell';
  cell.innerHTML = `<div class="label"><b>${name}</b><br>${NOTES[name]}<br>${p.all.length / 9} tris (${p.skin} skin, rest gear)</div>`;
  grid.appendChild(cell);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(devicePixelRatio);
  renderer.setClearColor(0x262c33);
  cell.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x3a3226, 0.75));
  const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(6, 10, 8); scene.add(sun);
  // Split the soup: gear legs are the parts wholly below the body.
  const body = [], gear = [];
  for (let o = 0; o < p.all.length; o += 9) {
    const maxY = Math.max(p.all[o + 1], p.all[o + 4], p.all[o + 7]);
    (maxY < -0.65 ? gear : body).push(...p.all.slice(o, o + 9));
  }
  const mesh = (arr, color) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3));
    g.computeVertexNormals();
    const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.8, side: THREE.DoubleSide }));
    m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g, 25), new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25 })));
    return m;
  };
  scene.add(mesh(body, 0x9aa7b4));
  scene.add(mesh(gear, 0xd08a3c));
  const deck = new THREE.GridHelper(30, 30, 0x55606b, 0x3a424a); deck.position.y = -2; scene.add(deck);
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 200);
  camera.position.set(-14, 9, 16);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0, 1);
  controls.update();
  views.push({ cell, renderer, scene, camera, controls });
}
function frame() {
  for (const v of views) {
    const w = v.cell.clientWidth, h = v.cell.clientHeight;
    if (v.renderer.domElement.width !== Math.round(w * devicePixelRatio)) { v.renderer.setSize(w, h, false); v.camera.aspect = w / h; v.camera.updateProjectionMatrix();
      // Fit a ~20 m jet whatever the cell's shape.
      const d = 30 / Math.min(1, v.camera.aspect);
      v.camera.position.copy(new THREE.Vector3(-0.55, 0.42, 0.72).normalize().multiplyScalar(d)).add(v.controls.target); v.controls.update(); }
    v.renderer.render(v.scene, v.camera);
  }
  requestAnimationFrame(frame);
}
frame();
</script></body></html>
